<!-- Generated by build.py from index.template.html: edit the template, then run python3 gion-drive/build.py.
     The opening of the game: title → solo or crew → the world map → the city's page (?play=solo or ?play=crew).

<link rel="stylesheet" href="theme.css">
<style>
:root{--line:var(--rule)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.4 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
h1{font:500 clamp(64px,12vw,128px)/1 var(--display);margin:0}
.tag{font:italic 20px var(--serif);color:var(--muted);margin:14px 0 34px;text-align:center;max-width:520px}
.actions{display:flex;flex-direction:column;gap:12px;align-items:center}
.primary{background:var(--gradient-button-primary-default);color:var(--color-text-white);border:0;border-radius:999px;padding:14px 34px;font-weight:600;font-size:17px}
.primary:hover:not(:disabled){background:var(--gradient-button-primary-hover)}
.primary:active:not(:disabled){background:var(--gradient-button-primary-active)}
.primary:disabled{background:var(--rule);cursor:default}
.secondary{background:var(--color-button-ghost-background);color:var(--color-button-ghost-foreground);border:1px solid var(--rule);border-radius:999px;padding:11px 28px;font-weight:600}
.secondary:hover{background:var(--color-button-ghost-hover)}
button:focus-visible{outline:2px solid var(--color-border-focus-ring);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:2px 0 0;text-align:center}
.note code{font-size:12px;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:1px 5px}
/* ---------- city selection: the world map, flat like the game: the city maps' water and sand, cream labels, fine ink ---------- */
#pick{position:fixed;inset:0;min-height:0;padding:0;display:block;overflow:hidden;background:#9cc3c4}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}#map.over{cursor:pointer}
.head,.zoom{z-index:1}
.head{position:absolute;left:20px;top:20px;max-width:340px;background:var(--panel,#fffcf3);border:1px solid var(--rule);border-radius:16px;padding:12px 18px 14px}
.head .gt-backbtn{margin:0 0 6px}
h2{font:500 30px/1.1 var(--display);margin:4px 0 4px}
.sub{color:var(--muted);margin:0;font-size:14px}
.zoom{position:absolute;left:20px;bottom:20px;display:flex;align-items:center;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;background:var(--panel,#fffcf3);border:1px solid var(--rule);font-size:19px;line-height:1;padding:0;color:var(--ink)}
.zoom button:hover{background:var(--color-background-primary-hover,#f8f4e9)}
.zoom span{font-size:12px;color:var(--muted);margin-left:4px;background:var(--panel,#fffcf3);border:1px solid var(--rule);border-radius:999px;padding:5px 11px}
#panel{position:absolute;right:20px;top:0;bottom:0;margin:auto 0;height:max-content;max-height:calc(100% - 140px);overflow:auto;width:300px;background:var(--panel,#fffcf3);border:1px solid var(--rule);
  border-radius:18px;padding:18px 18px 16px;transition:opacity .22s ease,transform .26s cubic-bezier(.2,.7,.2,1)}
#panel.off{opacity:0;transform:translateY(10px);pointer-events:none}
#panel .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:none;font-size:16px;color:var(--muted)}
#panel .icon{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#f0e6cf;margin-bottom:10px}#panel .icon svg{width:32px;height:32px}
#panel .eyebrow{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-right:28px}
#panel h3{font:500 26px/1.1 var(--display);margin:4px 0 2px}
#panel .where{margin:0 0 12px;color:var(--muted);font-size:13px}
#panel .pv{border:1px solid var(--rule);border-radius:12px;overflow:hidden;aspect-ratio:1;max-height:220px;margin:0 auto 12px;background:#efe7d4}
#panel .pv svg{display:block;width:100%;height:100%}
#panel .blurb{margin:0 0 14px;font-size:13px;color:var(--muted)}
#panel .primary{width:100%}
#panel .none{font:500 17px var(--display);margin:10px 0 12px}
#panel .secondary{width:100%;padding:11px 14px}
/* a city with a shift: its map fills the whole card, fading to paper at the bottom under the name, one line and Start */
#panel.shift{padding:0;overflow:hidden;height:440px;max-height:calc(100% - 140px)}
#panel.shift .body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
#panel.shift .pv{position:absolute;inset:0;margin:0;border:0;border-radius:0;aspect-ratio:auto;max-height:none;width:auto}
#panel.shift .pv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--panel,#fffcf3) 0%,var(--panel,#fffcf3) 24%,#fffcf3d9 40%,#fffcf300 68%)}
#panel.shift .pfoot{position:relative;padding:0 20px 18px}
#panel.shift h3{font-size:34px;margin:0 0 4px}
#panel.shift .blurb{margin:0 0 14px;color:var(--ink);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel.shift .x{z-index:2;background:#fffcf3e6}
#panel .body{transition:opacity .16s ease}
#panel .body.swap{opacity:0}
@media (max-width:720px){
  .head{left:12px;top:12px;padding:8px 12px 10px}h2{font-size:22px;margin:2px 0 0}.sub{display:none}
  .zoom{left:auto;right:16px;bottom:auto;top:16px}.zoom span{display:none}
  #panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;margin:0;max-height:calc(100% - 90px);z-index:2}
  #panel.off{transform:translateY(12px)}
  #panel:not(.shift) .pv{max-height:150px;width:150px}
  #panel.shift{height:360px}
}

/* motion: short and eased; a screen leaves before the next arrives, its parts a beat apart */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
main.enter>*:not(#panel){animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#pick.enter>#map{animation:fadein .5s ease both}
main.enter>*:nth-child(2){animation-delay:.07s}main.enter>*:nth-child(3){animation-delay:.14s}main.enter>*:nth-child(4){animation-delay:.21s}
main.leave{opacity:0;transform:translateY(-8px);transition:opacity .2s ease,transform .22s ease}
body{transition:opacity .38s cubic-bezier(.4,0,.2,1)}
body.going{opacity:0}
@media (prefers-reduced-motion:reduce){main.enter>*,main.enter>*:not(#panel),#pick.enter>#map{animation:none}main.leave,body,#panel,#panel .body{transition:none}}

/* ---------- the hero (the title screen): a painted morning, the city rolling past, the whole crew in one taxi ---------- */
#title.hero{position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;min-height:max(100svh,640px);overflow:hidden;
  background:linear-gradient(180deg,#b9d8dc 0%,#d3e6e0 38%,#efeedd 70%,#f6efdc 100%)}
.hero .sky{position:absolute;inset:0;pointer-events:none}
.hero .sun{position:absolute;right:10%;top:14%;width:clamp(70px,8vw,120px);aspect-ratio:1;border-radius:50%;
  background:#f6dfae}
.hero .grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff38 1px,transparent 1px),linear-gradient(90deg,#ffffff38 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:linear-gradient(180deg,#000 0,#0000 62%);mask-image:linear-gradient(180deg,#000 0,#0000 62%)}
.hero .nav{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,4vw,48px) 8px}
.hero .mark{font:500 27px/1 var(--display);letter-spacing:-.01em}
.hero .stops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hero .stops a.lab{font:600 12px/1 var(--sans);letter-spacing:.04em;padding:7px 11px;border-radius:999px;background:var(--ink,#263c35);color:#fffcf3;text-decoration:none}
.hero .stops span{font:600 12px/1 var(--sans);letter-spacing:.04em;padding:7px 11px;border-radius:999px;background:#fffcf3b8;border:1px solid #ffffffa0;color:var(--muted)}
.hero .copy{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(4px,2vh,28px) 20px clamp(12px,3vh,36px)}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);
  background:#fffcf3d0;border:1px solid #fff;border-radius:999px;padding:6px 12px 6px 6px;box-shadow:0 2px 10px #263c3510}
.hero .eyebrow .faces{display:flex}.hero .eyebrow .faces svg{margin-left:-5px;background:#f6efdc;border-radius:50%}.hero .eyebrow .faces svg:first-child{margin-left:0}
.hero h1{font:500 clamp(40px,5vw,74px)/1 var(--display);letter-spacing:-.015em;margin:14px 0 30px;max-width:15ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--color-accent-500)}
.hero .lede{font:400 clamp(16px,1.3vw,18px)/1.5 var(--sans);color:#3f5049;max-width:540px;margin:14px 0 22px;text-wrap:pretty}
.hero .modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mode{display:flex;align-items:center;gap:14px;text-align:left;border-radius:20px;padding:12px 22px 12px 12px;min-width:250px;border:1px solid;
  transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,background .25s}
.mode .pic{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;flex:none}
.mode .pic.four{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:3px}
.mode small{display:block;font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:5px}
.mode b{display:block;font:500 22px/1.05 var(--display)}
.mode i{display:block;font:400 13px/1.3 var(--sans);font-style:normal;opacity:.8;margin-top:4px}
.mode.multi{background:var(--gradient-button-primary-default);border-color:var(--color-accent-600);color:#fff;box-shadow:0 10px 28px #91382a40}
.mode.multi .pic{background:#fff3e2}
.mode.solo{background:#fffcf3e8;border-color:#fff;color:var(--ink);box-shadow:0 10px 28px #263c3516}
.mode.solo .pic{background:#f0e6cf}
.mode:hover:not(:disabled){transform:translateY(-3px)}
.mode.multi:hover:not(:disabled){background:var(--gradient-button-primary-hover);box-shadow:0 14px 34px #91382a55}
.mode.solo:hover{background:#fffcf3;box-shadow:0 14px 34px #263c3524}
.mode:disabled{background:#e9e2d2;border-color:var(--rule);color:var(--muted);box-shadow:none;cursor:default}
.mode:disabled .pic{filter:grayscale(1);opacity:.6}
.hero .note{max-width:420px;margin-top:10px}
/* the moving picture: each layer is two copies of one strip, slid left by one copy and looped */
.hero .scene{--W:max(100vw,1100px);position:relative;flex:none;margin-top:auto;height:calc(var(--W) * .2);min-height:230px;pointer-events:none}
.hero .layer{position:absolute;left:0;width:calc(var(--W) * 2);display:flex;animation:pan var(--t) linear infinite;will-change:transform}
.hero .layer svg{width:50%;height:auto;display:block;flex:none}
.hero .clouds{bottom:calc(var(--W) * .2);--t:150s;opacity:.95}
.hero .far{bottom:calc(var(--W) * .118);--t:110s}
.hero .mid{bottom:calc(var(--W) * .0925);--t:46s}
.hero .street{bottom:0;--t:9s}
@keyframes pan{to{transform:translateX(-50%)}}
.hero .taxi{position:absolute;left:50%;bottom:calc(var(--W) * .002);width:calc(var(--W) * .2125);transform:translateX(-50%);animation:cruise 9s ease-in-out infinite}
.hero .taxi svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes cruise{0%,100%{transform:translateX(-52%)}50%{transform:translateX(-46%)}}
.taxi .rig{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1.6px)}}
.taxi .nod{animation:nod 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-1.5px) rotate(2deg)}}
.taxi .lookout{animation:look 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes look{from{transform:rotate(-7deg)}to{transform:rotate(6deg) translateY(-2px)}}
.taxi .spin{animation:spin .55s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.taxi .puff{animation:puff 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.taxi .puff:nth-of-type(2){animation-delay:.47s}.taxi .puff:nth-of-type(3){animation-delay:.94s}
@keyframes puff{0%{opacity:.75;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-46px,-14px) scale(1.6)}}
.hero .street .glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.25}to{opacity:.5}}
@media (max-width:640px){.hero .stops{display:none}.mode{min-width:0;width:100%}.hero .modes{width:100%;max-width:360px}.hero .eyebrow{font-size:10.5px;letter-spacing:.06em}.hero .scene{--W:900px;min-height:0;height:180px}.hero .sun{top:auto;bottom:250px;right:6%;width:90px}}

@media (prefers-reduced-motion:reduce){.hero .layer,.hero .taxi,.taxi *,.hero .street .glow{animation-play-state:paused!important}}
</style></head>
<body>
<main id="title" class="hero">

<script>
/* the hero's picture, drawn once as SVG strips: far landmarks (one per city, with a pin), a street of shops and autumn
   trees, the road with lanterns, and the taxi with the crew aboard. Each strip is 1600 units wide and tiles seamlessly. */
(() => {
const scene = document.getElementById('scene'); if (!scene) return;
const C = window.GionCrew && window.GionCrew.svg ? window.GionCrew : null;
let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646 };
const pick = a => a[Math.floor(rnd() * a.length)], range = (a, b) => a + rnd() * (b - a);
const mix = (hex, k) => { const n = parseInt(hex.slice(1), 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255], t = k > 0 ? 255 : 30;
  return '#' + c.map(v => Math.round(v + (t - v) * Math.abs(k)).toString(16).padStart(2, '0')).join('') };
const poly = (pts, fill, extra = '') => `<path d="M${pts.map(p => p.join(' ')).join('L')}Z" fill="${fill}"${extra}/>`;
const rect = (x, y, w, h, fill, extra = '') => `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}"${extra}/>`;
const oct = (x, y, r, fill) => { const k = r * .42; return poly([[x - k, y - r], [x + k, y - r], [x + r, y - k], [x + r, y + k], [x + k, y + r], [x - k, y + r], [x - r, y + k], [x - r, y - k]], fill) };
const strip = (vh, body, cls) => { const svg = `<svg viewBox="0 0 1600 ${vh}" preserveAspectRatio="xMidYMax meet">${body}</svg>`;
  scene.insertAdjacentHTML('beforeend', `<div class="layer ${cls}">${svg}${svg}</div>`) };

/* clouds: soft flat stacks */
let cl = '';
for (const [x, y, s] of [[120, 90, 1], [520, 40, .7], [860, 120, 1.25], [1240, 60, .85], [1480, 140, .6]]) {
  const g = (dx, dy, w, h) => `<rect x="${x + dx * s}" y="${y + dy * s}" width="${w * s}" height="${h * s}" rx="${h * s / 2}" fill="#fffcf3"/>`;
  cl += `<g opacity=".9">${g(0, 30, 220, 44)}${g(40, 6, 110, 50)}${g(110, 16, 90, 40)}</g>`;
}
strip(260, cl, 'clouds');

/* far: a hazy skyline with one landmark per city and a pin naming it */
const HAZE = '#c3d7d3', LAND = '#a9c3bf', GY = 260;
let far = '';
for (let x = 0; x < 1600;) { const w = Math.min(range(40, 90), 1600 - x), h = range(26, 86); far += rect(x, GY - h, w + .5, h, HAZE); x += w }
const pin = (x, y, name) => `<g transform="translate(${x} ${y})"><path d="M0 0V18" stroke="#8fa9a5" stroke-width="2"/>` +
  `<rect x="${-name.length * 4.2 - 14}" y="-26" width="${name.length * 8.4 + 28}" height="26" rx="13" fill="#fffcf3"/>` +
  `<circle cx="${-name.length * 4.2 - 3}" cy="-13" r="4" fill="#c8513a"/>` +
  `<text x="${5}" y="-8.5" text-anchor="middle" font-family="Suisse Intl, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#263c35">${name}</text></g>`;
// Tokyo: a five-storey pagoda (Sensō-ji's, in Asakusa)
{ const cx = 190; let y = GY; far += rect(cx - 34, y - 12, 68, 12, LAND); y -= 12;
  for (let i = 0; i < 5; i++) { const w = 74 - i * 9; far += rect(cx - w * .32, y - 16, w * .64, 16, LAND); y -= 16;
    far += poly([[cx - w / 2 - 12, y + 2], [cx - w / 2 + 4, y - 9], [cx + w / 2 - 4, y - 9], [cx + w / 2 + 12, y + 2]], LAND); y -= 9 }
  far += rect(cx - 1.5, y - 34, 3, 34, LAND); far += pin(cx, y - 70, 'Tokyo') }
// London (Western University): a gothic stone tower with pinnacles and a clock
{ const cx = 590; far += rect(cx - 70, GY - 70, 140, 70, LAND) + poly([[cx - 70, GY - 70], [cx - 50, GY - 88], [cx + 50, GY - 88], [cx + 70, GY - 70]], LAND);
  far += rect(cx - 22, GY - 170, 44, 170, LAND);
  for (const dx of [-22, 14]) far += poly([[cx + dx, GY - 170], [cx + dx + 4, GY - 192], [cx + dx + 8, GY - 170]], LAND);
  far += poly([[cx - 12, GY - 170], [cx, GY - 186], [cx + 12, GY - 170]], LAND);
  far += `<circle cx="${cx}" cy="${GY - 140}" r="9" fill="${HAZE}"/>`; far += pin(cx, GY - 226, 'London') }
// Toronto: the CN Tower and City Hall's two curved towers
{ const cx = 990; far += poly([[cx - 9, GY], [cx - 3, GY - 170], [cx + 3, GY - 170], [cx + 9, GY]], LAND);
  far += poly([[cx - 20, GY - 158], [cx + 20, GY - 158], [cx + 14, GY - 146], [cx - 14, GY - 146]], LAND) + rect(cx - 5, GY - 186, 10, 16, LAND) + rect(cx - 1, GY - 222, 2, 36, LAND);
  const hx = 1080; far += `<path d="M${hx - 50} ${GY}V${GY - 74}Q${hx - 30} ${GY - 82} ${hx - 14} ${GY - 70}V${GY}Z" fill="${LAND}"/>`;
  far += `<path d="M${hx + 50} ${GY}V${GY - 96}Q${hx + 30} ${GY - 104} ${hx + 14} ${GY - 90}V${GY}Z" fill="${LAND}"/>`;
  far += `<path d="M${hx - 18} ${GY - 30}Q${hx} ${GY - 50} ${hx + 18} ${GY - 30}Z" fill="${LAND}"/>` + rect(hx - 60, GY - 26, 120, 26, LAND);
  far += pin(cx, GY - 250, 'Toronto') }
// Amsterdam: a row of narrow canal houses with step and bell gables
{ let x = 1300; for (const [w, h, g] of [[30, 92, 's'], [26, 104, 'b'], [32, 86, 't'], [26, 110, 's'], [30, 96, 'b']]) {
    far += rect(x, GY - h, w, h, LAND);
    if (g === 's') far += rect(x + 4, GY - h - 8, w - 8, 8, LAND) + rect(x + 9, GY - h - 16, w - 18, 8, LAND);
    else if (g === 'b') far += `<path d="M${x + 2} ${GY - h}Q${x + 4} ${GY - h - 12} ${x + w / 2} ${GY - h - 20}Q${x + w - 4} ${GY - h - 12} ${x + w - 2} ${GY - h}Z" fill="${LAND}"/>`;
    else far += poly([[x, GY - h], [x + w / 2, GY - h - 18], [x + w, GY - h]], LAND);
    x += w + 1 }
  far += pin(1370, GY - 160, 'Amsterdam') }
strip(GY, far, 'far');

/* mid: a street of shops and houses, light from the upper right like the game's map, with autumn trees between */
const WALLS = ['#efdfbd', '#e6c99f', '#dcb98f', '#d3dcc6', '#ecc8b0', '#f3e7cb', '#cfdcd8'], ROOF = ['#9b5a43', '#5e7b6e', '#7a5a49', '#b06a4a'];
const LEAF = ['#e0702c', '#d9a23a', '#c8513a', '#e8b04a'], MY = 200;
let mid = '';
for (let x = 0; x < 1600;) {
  if (rnd() < .28 && x < 1540) { const t = x + 22, h = range(38, 56), c = pick(LEAF);   // a tree
    mid += rect(t - 2.5, MY - 22, 5, 22, '#7a5a3c') + oct(t, MY - h, range(15, 20), c) + oct(t + 4, MY - h - 4, 8, mix(c, .25)); x += 44; continue }
  let w = Math.round(range(72, 150)); if (1600 - x - w < 72) w = 1600 - x;
  const h = Math.round(range(62, 128)), wall = pick(WALLS), top = MY - h;
  mid += rect(x, top, w, h, wall) + rect(x, top, Math.min(12, w * .14), h, mix(wall, -.1));
  const r = rnd();
  if (r < .4) mid += poly([[x - 5, top], [x + w / 2, top - Math.min(36, w * .32)], [x + w + 5, top]], pick(ROOF));
  else if (r < .75) mid += rect(x - 4, top - 7, w + 8, 7, mix(wall, -.22));
  else mid += rect(x + w * .2, top - 14, w * .6, 14, mix(wall, -.06)) + rect(x + w * .2 - 3, top - 18, w * .6 + 6, 5, mix(wall, -.22));
  const cols = Math.max(1, Math.floor((w - 18) / 24)), rows = Math.max(1, Math.floor((h - 44) / 30)), gx = (w - cols * 12) / (cols + 1);
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++)
    mid += rect(x + gx + j * (12 + gx), top + 14 + i * 30, 12, 16, rnd() < .18 ? '#f7dc9a' : '#a8bfbb', ' rx="1.5"');
  if (rnd() < .55) { const aw = Math.min(w - 16, 64), ax = x + (w - aw) / 2, ac = pick(['#c8513a', '#36594b', '#4f6d8a', '#c9932c']);   // a shop awning
    mid += poly([[ax, MY - 36], [ax + aw, MY - 36], [ax + aw + 4, MY - 26], [ax - 4, MY - 26]], ac) + rect(ax + 4, MY - 26, aw - 8, 26, '#5d6f6a') }
  else mid += rect(x + w / 2 - 8, MY - 24, 16, 24, mix(wall, -.3));
  x += w;
}
strip(MY, mid, 'mid');

/* street: sidewalk, curb, road with dashes, and paper lanterns on posts */
const RY = 150;
let st = rect(0, RY, 1600, 24, '#ebe1cb') + rect(0, RY + 22, 1600, 5, '#cdbfa3') + rect(0, RY + 27, 1600, 123, '#646e68') + rect(0, RY + 27, 1600, 4, '#58615c');
for (let i = 0; i < 20; i++) st += rect(i * 80 + 18, 238, 44, 4, '#f3e6cc', ' rx="2" opacity=".85"');
for (let i = 0; i < 5; i++) { const x = i * 320 + 150;
  st += rect(x - 2, 46, 4, RY + 10 - 46, '#3d4a46') + rect(x - 2, 46, 22, 3, '#3d4a46') + rect(x + 17, 49, 1.5, 6, '#3d4a46');
  st += `<circle class="glow" cx="${x + 18}" cy="70" r="20" fill="#f9cf7a"/>`;
  st += `<rect x="${x + 9}" y="55" width="18" height="26" rx="7" fill="#c8513a"/>` + rect(x + 9, 64, 18, 3, '#f3e6cc', ' opacity=".7"') + rect(x + 12, 53, 12, 3, '#3d4a46') + rect(x + 12, 80, 12, 3, '#3d4a46');
  st += oct(x + 90, RY - 6, 10, '#7f9d7f') + oct(x + 104, RY - 4, 8, '#6d8f70') }
strip(300, st, 'street');

/* the taxi: facing right, the fox driving, the bear and owl in the back, the raccoon out of the sunroof */
const head = (kind, x, y, size, cls, delay = 0) => C ? `<g transform="translate(${x} ${y})"><g class="${cls}" style="animation-delay:${delay}s">${C.svg(kind, { size, shadow: false, title: false })}</g></g>` : '';
const GOLD = '#c8402f', GOLD_D = '#a8352a', WIN = '#dcebe8';   // the map's taxi red
const taxi = `<svg viewBox="0 0 340 170">
  <defs><pattern id="hw-kerb" width="16" height="7" patternUnits="userSpaceOnUse"><rect width="8" height="7" fill="#fffcf3"/><rect x="8" width="8" height="7" fill="#c8402f"/></pattern><clipPath id="hw-rear"><path d="M100 84L130 42H182V84Z"/></clipPath><clipPath id="hw-front"><path d="M190 42H240L272 84H190Z"/></clipPath></defs>
  <ellipse cx="172" cy="158" rx="150" ry="8" fill="#263c35" opacity=".2"/>
  <g><circle class="puff" cx="6" cy="128" r="7" fill="#fffcf3"/><circle class="puff" cx="6" cy="128" r="7" fill="#fffcf3"/><circle class="puff" cx="6" cy="128" r="7" fill="#fffcf3"/></g>
  <g class="rig">
    ${head('raccoon', 134, -8, 50, 'lookout')}
    <path d="M14 128V100L28 88L92 82L126 34H246L284 82L318 88L330 100V128Z" fill="${GOLD}" stroke="${GOLD}" stroke-width="6" stroke-linejoin="round"/>
    <path d="M14 108H330V128H14Z" fill="${GOLD_D}" stroke="${GOLD_D}" stroke-width="6" stroke-linejoin="round"/>
    <rect x="18" y="98" width="308" height="7" fill="url(#hw-kerb)"/>
    <path d="M100 84L130 42H182V84Z" fill="${WIN}"/><path d="M190 42H240L272 84H190Z" fill="${WIN}"/>
    <g clip-path="url(#hw-rear)">${head('bear', 116, 50, 40, 'nod', -.45)}${head('owl', 146, 50, 40, 'nod', -.9)}</g>
    <g clip-path="url(#hw-front)">${head('fox', 204, 48, 40, 'nod')}</g>
    <path d="M120 84V42M186 84V40" stroke="${GOLD_D}" stroke-width="4"/>
    <path d="M186 88V124" stroke="${GOLD_D}" stroke-width="1.5" opacity=".7"/><rect x="166" y="90" width="12" height="3" rx="1.5" fill="${GOLD_D}"/><rect x="232" y="90" width="12" height="3" rx="1.5" fill="${GOLD_D}"/>
    <rect x="221" y="10" width="12" height="4" rx="1.5" fill="#263c35"/><ellipse cx="227" cy="22" rx="14" ry="10" fill="#f2c94c"/><path d="M215 19.5H239M214.5 24.5H239.5" stroke="#d9a72e" stroke-width="1.4"/><rect x="220" y="30" width="14" height="4" rx="1.5" fill="#263c35"/>
    <rect x="316" y="92" width="14" height="8" rx="2" fill="#fbe4b6"/><rect x="12" y="92" width="8" height="10" rx="2" fill="#7d2a20"/>
    <rect x="6" y="122" width="40" height="10" rx="4" fill="#3d4a46"/><rect x="298" y="122" width="40" height="10" rx="4" fill="#3d4a46"/>
  </g>
  ${[86, 262].map(x => `<g transform="translate(${x} 132)"><circle r="23" fill="#2f3b37"/><circle r="11" fill="#e9dfca"/>
    <g class="spin"><circle r="11" fill="none"/><path d="M-9 0H9M0 -9V9" stroke="#8a948d" stroke-width="2.5" stroke-linecap="round"/></g><circle r="3" fill="#3d4a46"/></g>`).join('')}
</svg>`;
scene.insertAdjacentHTML('beforeend', `<div class="taxi">${taxi}</div>`);

/* the faces on the two choices */
if (C) {
  const KINDS = ['fox', 'bear', 'owl', 'raccoon'];
  document.getElementById('crewPic').innerHTML = KINDS.map(k => C.svg(k, { size: 23, shadow: false, title: false })).join('');
  document.getElementById('soloPic').innerHTML = C.svg('fox', { size: 42, shadow: false, title: false });
}
})();
</script>
<script>
(() => {
const $ = id => document.getElementById(id);
const served = /^https?:$/.test(location.protocol);   // crew play needs the server (it relays the phones)
if (!served) { $('crew').disabled = true; $('crewNote').hidden = false }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- the world map, light and modern: soft blue water that pales along the coasts, pale green land, quiet grey
   names, and a white rounded tile with a landmark on each city (tiles that would collide give way as you zoom out; the
   playable cities always show). Miller projection. World data: Natural Earth (globe/world.js). ---------- */
const W = window.GT_WORLD, SHIFTS = window.GT_SHIFTS || [];
const D2R = Math.PI / 180, LAT0 = -56, LAT1 = 78;   // the sheet runs from the Southern Ocean to the High Arctic
const miller = lat => 1.25 * Math.log(Math.tan(Math.PI / 4 + .4 * Math.max(-89, Math.min(89, lat)) * D2R));
const Y0 = miller(LAT1), MW = 2 * Math.PI, MH = Y0 - miller(LAT0);
const PX = lon => (lon + 180) * D2R, PY = lat => Y0 - miller(lat);   // map units: x 0…MW from the date line east, y 0…MH down
const C = { sea: '#9cc3c4', shallow: '#b2d1d0', land: '#efe7d4', ice: '#f8f4ea', coast: '#a89a85', ink: '#263c35', card: '#fffcf3', line: '#ded6c5', rust: '#a04631', ticket: '#fffcf3', ticketLine: '#ded6c5', ticketInk: '#263c35', lantern: '#c8513a', glow: '#e9a08a' };
// land and lakes as paths in map units, built once (a coast that crosses the date line is unwrapped and drawn on both sides)
const unwrap = r => { const out = []; let off = 0, prev = null; for (let i = 0; i < r.length; i += 2) { let lon = r[i] / 100; if (prev !== null) { if (lon + off - prev > 180) off -= 360; else if (lon + off - prev < -180) off += 360 } lon += off; out.push(lon, r[i + 1] / 100); prev = lon } return out };
function polyPath(poly) {
  const p = new Path2D(), rings = poly.map(unwrap);
  let lo = Infinity, hi = -Infinity; for (const r of rings) for (let i = 0; i < r.length; i += 2) { lo = Math.min(lo, r[i]); hi = Math.max(hi, r[i]) }
  for (const off of [-360, 0, 360]) {
    if (hi + off < -180 || lo + off > 180) continue;
    for (const r of rings) { for (let i = 0; i < r.length; i += 2) { const x = PX(r[i] + off), y = PY(r[i + 1]); i ? p.lineTo(x, y) : p.moveTo(x, y) } p.closePath() }
  }
  return p;
}
const meanLat = r => { let s = 0; for (let i = 1; i < r.length; i += 2) s += r[i]; return s / (r.length / 2) / 100 };
const maxLat = r => { let m = -90; for (let i = 1; i < r.length; i += 2) m = Math.max(m, r[i] / 100); return m };
const LAND = W.land.filter(poly => maxLat(poly[0]) > LAT0 - 2).map(poly => ({ path: polyPath(poly), fill: Math.abs(meanLat(poly[0])) > 62 ? C.ice : C.land }));
const COAST = new Path2D(); for (const l of LAND) COAST.addPath(l.path);
const LAKES = new Path2D(); for (const poly of W.lakes) LAKES.addPath(polyPath(poly));
const PLACES = W.places.filter(([, , lat]) => lat > LAT0 && lat < LAT1).map(([name, country, lat, lon, rank]) => ({ name, country, lat, lon, rank, x: PX(lon), y: PY(lat) }));

  samples.push([performance.now(), -dx / S, -dy / S]); if (samples.length > 6) samples.shift();
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); cv.classList.remove('dragging');
  if (ptrs.size) { pinch0 = null; return }
  if (moved < 6 && e.type === 'pointerup') { const d = hit(e, e.pointerType === 'mouse' ? 14 : 24); if (d) select(d.p) }
  else if (!reduce && samples.length > 1 && performance.now() - samples[samples.length - 1][0] < 80) {   // let it coast a little
    const t = Math.max(.05, (samples[samples.length - 1][0] - samples[0][0]) / 1000), sum = samples.reduce((a, s) => [a[0] + s[1], a[1] + s[2]], [0, 0]);
    const cap = 1500 / scale(), c = v => Math.max(-cap, Math.min(cap, v * .8));   // at most 1500 px/s, however sharp the flick
    spin = { x: c(sum[0] / t), y: c(sum[1] / t) };
  }
};
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, up);
cv.addEventListener('pointerleave', () => { if (hover) { hover = null; dirty = true; cv.classList.remove('over') } });
cv.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = local(e); zoomAt(Math.exp(-e.deltaY * .0015), x, y) }, { passive: false });
cv.addEventListener('keydown', e => {
  const k = { ArrowLeft: [-80, 0], ArrowRight: [80, 0], ArrowUp: [0, -80], ArrowDown: [0, 80] }[e.key];
  if (k) { e.preventDefault(); stopAll(); view.cx += k[0] / scale(); view.cy += k[1] / scale(); clamp(); dirty = true }
  else if (e.key === '+' || e.key === '=') zoomAt(1.3); else if (e.key === '-') zoomAt(1 / 1.3);
});
$('zin').onclick = () => zoomAt(1.4); $('zout').onclick = () => zoomAt(1 / 1.4);
function hit(e, radius = 14) {
  const [x, y] = local(e);
  for (let i = tiles.length - 1; i >= 0; i--) { const t = tiles[i]; if (t.a > .5 && Math.abs(t.x - x) <= t.w / 2 + 2 && Math.abs(t.y - y) <= LH / 2 + 2) return { p: t.p, x: t.ax, y: t.ay } }
  let best = null, bd = radius;
  for (const d of dots) { const dd = Math.hypot(d.x - x, d.y - y); if (dd < bd) { bd = dd; best = d } }
  return best;
}

/* ---------- choosing: a playable city shows its map and Continue; anywhere else points to the nearest shift ---------- */
const km = (a, b) => { const v = p => { const la = p.lat * D2R, lo = p.lon * D2R; return [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)] }, u = v(a), q = v(b);
  return 6371 * Math.acos(Math.max(-1, Math.min(1, u[0] * q[0] + u[1] * q[1] + u[2] * q[2]))) };
let panelT = null;
function select(p, fromMenu = false) {
  selected = p; hover = null; dirty = true;
  const panel = $('panel'), body = $('pbody'), opening = panel.hidden || panel.classList.contains('off');
  if (opening) { panel.hidden = false }   // shown first, so the glide aims beside it
  flyTo(viewFor(p, Math.max(view.k, p.shift ? 3 : 2.6)));
  const s = p.shift, near = s ? null : playable.map(t => ({ t, d: km(p, t.place_) })).sort((a, b) => a.d - b.d)[0];
  const html = s
    ? `<div class="pv">${s.preview.replace('<svg ', '<svg preserveAspectRatio="xMidYMid slice" ')}</div>
       <div class="pfoot"><h3>${esc(s.name)}</h3><p class="blurb">${esc(s.place)}</p><button class="primary" id="go">Start</button></div>`
    : `<span class="icon" aria-hidden="true">${iconSVG(p.icon)}</span><span class="eyebrow">${esc(p.country)}</span><h3>${esc(p.name)}</h3><p class="none">Not open yet</p>
       ${near ? `<button class="secondary" id="near" data-shift="${near.t.id}">${esc(near.t.name)} →</button>` : ''}`;
  const fill = () => {
    body.innerHTML = html; body.classList.remove('swap'); panel.classList.toggle('shift', !!s);
    $('go')?.addEventListener('click', () => go(s));
    $('near')?.addEventListener('click', () => select(playable.find(t => t.id === $('near').dataset.shift).place_, true));
    if (fromMenu) ($('go') || $('near'))?.focus({ preventScroll: true });
  };
  clearTimeout(panelT);
  if (opening || reduce) { fill(); void panel.offsetWidth; panel.classList.remove('off') }
  else { body.classList.add('swap'); panelT = setTimeout(fill, 140) }   // a quick crossfade between cities
}
function closePanel() {
  selected = null; dirty = true;
  const panel = $('panel'); panel.classList.add('off'); clearTimeout(panelT); panelT = setTimeout(() => { panel.hidden = true }, reduce ? 0 : 240);
}
$('pclose').onclick = closePanel;
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('pick').hidden && selected) closePanel() });
// continue in the chosen mode: the map leans in on the city as the page fades to paper, and the city page opens on that paper
let going = false;
function go(s) {
  if (going) return;
  const href = s.href + '?play=' + mode();
  if (reduce) { location.href = href; return }
  going = true; const [fx, fy] = toScreen(s.place_.x, s.place_.y), k = Math.min(K_MAX, view.k * 1.4), S2 = S0 * k;
  anim = { from: { ...view }, to: { k, cx: s.place_.x - (fx - w / 2) / S2, cy: s.place_.y - (fy - h / 2) / S2 }, t0: performance.now(), dur: 520, free: true };
  setTimeout(() => document.body.classList.add('going'), 120);
  setTimeout(() => { location.href = href; going = false }, 500);
}

/* ---------- screens: the address picks one. #crew or #solo is the map for that mode, anything else the title.
   The current screen fades out (200 ms) before the next one rises in, its parts staggered. ---------- */
let shown = null;
const mode = () => location.hash.slice(1);
function render() {
  const m = mode(), picking = m === 'solo' || (m === 'crew' && served);
  const next = picking ? $('pick') : $('title');
  const show = () => {
    $('title').hidden = next !== $('title'); $('pick').hidden = next !== $('pick');
    for (const el of [$('title'), $('pick')]) el.classList.remove('leave', 'enter');
    void next.offsetWidth; next.classList.add('enter'); shown = next;
    if (picking) Map_.wake();
  };
  if (!shown || shown === next || reduce) return show();
  shown.classList.add('leave'); setTimeout(show, 200);
}
$('crew').onclick = () => { location.hash = 'crew' };
$('solo').onclick = () => { location.hash = 'solo' };
$('back').onclick = () => { location.hash = '' };
// back from a city page via the browser: the page may come back from memory, faded out; bring it back
addEventListener('pageshow', e => { if (e.persisted) { document.body.classList.remove('going'); going = false; if (!$('pick').hidden) Map_.wake() } });
const unproj = (x, y) => [x / D2R - 180, (2.5 * Math.atan(Math.exp(.8 * (Y0 - y))) - .625 * Math.PI) / D2R];
window.GionMap = { get view() { const [lon, lat] = unproj(view.cx, view.cy); return { lon, lat, k: view.k } },
  select: id => { const s = playable.find(s => s.id === id); if (s) select(s.place_, true) },
  selectPlace: (name, country) => { const p = PLACES.find(p => p.name === name && (!country || p.country === country)); if (p) select(p) },
  screenOf: (name, country) => { const p = PLACES.find(p => p.name === name && (!country || p.country === country)); return p ? toScreen(p.x, p.y) : null },
  get selected() { return selected }, get dots() { return dots }, get interacted() { return interacted }, get playable() { return playable.map(s => s.id) }, size: () => [w, h] };
addEventListener('hashchange', render); render();
})();
</script>
<script>if (/^https?:$/.test(location.protocol)) document.getElementById('labLink').hidden = false</script>
