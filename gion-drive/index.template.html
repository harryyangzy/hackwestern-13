<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tandem</title>
<meta name="description" content="tandem: drive one taxi together, with your phones as the controls.">
<!-- Generated by build.py from index.template.html: edit the template, then run python3 gion-drive/build.py.
     The opening of the game: title → city selection → the city's page (?play=solo or ?play=crew). -->
<link rel="stylesheet" href="theme.css">
<style>
:root{--line:var(--rule)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.4 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
h1{font:500 clamp(64px,12vw,128px)/1 var(--display);margin:0}
.tag{font:italic 20px var(--serif);color:var(--muted);margin:14px 0 34px;text-align:center;max-width:520px}
.actions{display:flex;flex-direction:column;gap:12px;align-items:center}
.primary{background:var(--gradient-button-primary-default);color:var(--color-text-white);border:0;border-radius:999px;padding:14px 34px;font-weight:600;font-size:17px}
.primary:hover:not(:disabled){background:var(--gradient-button-primary-hover)}
.primary:active:not(:disabled){background:var(--gradient-button-primary-active)}
.primary:disabled{background:var(--rule);cursor:default}
.secondary{background:var(--color-button-ghost-background);color:var(--color-button-ghost-foreground);border:1px solid var(--rule);border-radius:999px;padding:11px 28px;font-weight:600}
.secondary:hover{background:var(--color-button-ghost-hover)}
button:focus-visible{outline:2px solid var(--color-border-focus-ring);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:2px 0 0;text-align:center}
.note code{font-size:12px;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:1px 5px}
h2{font:500 32px var(--display);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:min(1000px,100%)}
.city{display:flex;flex-direction:column;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;box-shadow:0 8px 24px #263c3514}
.city:hover:not(:disabled),.city:focus-visible{border-color:var(--rust);box-shadow:0 8px 24px #ac493126}
.city:disabled{opacity:.45;cursor:default}
.city svg{display:block;width:100%;aspect-ratio:1;border-bottom:1px solid var(--rule)}
.city span{display:flex;flex-direction:column;gap:3px;padding:12px 14px 14px}
.city b{font:500 21px var(--display)}
.city small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.city em{font:italic 14px var(--serif);color:var(--muted)}
.back{background:none;border:0;color:var(--rust);font-weight:600;margin:22px 0 0}
/* motion: short and eased; a screen leaves before the next arrives, its parts a beat apart */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
main.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.07s}main.enter>*:nth-child(3){animation-delay:.14s}main.enter>*:nth-child(4){animation-delay:.21s}
main.enter .city{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.12s + var(--i) * .06s)}
main.leave{opacity:0;transform:translateY(-8px);transition:opacity .2s ease,transform .22s ease}
.city{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s,opacity .3s}
.city:hover:not(:disabled){transform:translateY(-3px)}
.city.chosen{transform:translateY(-6px) scale(1.02);border-color:var(--rust);box-shadow:0 16px 40px #ac493133}
.cities.choosing .city:not(.chosen){opacity:.35}
body{transition:opacity .38s cubic-bezier(.4,0,.2,1)}
body.going{opacity:0}
@media (prefers-reduced-motion:reduce){main.enter>*,main.enter .city{animation:none}main.leave,.city,body{transition:none}}
</style></head>
<body>
<main id="title">
  <h1>tandem</h1>
  <p class="tag">One taxi, the whole crew. Pick up and deliver passengers together before the shift ends.</p>
  <div class="actions">
    <button class="primary" id="crew">Play with Friends</button>
    <p class="note" id="crewNote" hidden>Playing with friends needs the crew server: run <code>node gion-drive/server.js</code> and open the address it prints.</p>
    <button class="secondary" id="solo">Play Solo</button>
  </div>
</main>
<main id="pick" hidden>
  <h2>Choose a city</h2>
  <p class="sub" id="pickSub"></p>
  <div class="cities" id="cities">
<!--CITIES-->
  </div>
  <button class="back" id="back">← Back</button>
</main>
<script>
(() => {
const $ = id => document.getElementById(id);
const served = /^https?:$/.test(location.protocol);   // crew play needs the server (it relays the phones)
if (!served) { $('crew').disabled = true; $('crewNote').hidden = false }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.city').forEach((c, i) => c.style.setProperty('--i', i));
// the screen follows the address: #crew or #solo is city selection for that mode, anything else the title.
// The current screen fades out (200 ms) before the next one rises in, its parts staggered.
let shown = null;
function render() {
  const mode = location.hash.slice(1);
  const picking = mode === 'solo' || (mode === 'crew' && served);
  const next = picking ? $('pick') : $('title');
  if (picking) $('pickSub').textContent = mode === 'crew' ? 'Then your friends scan a code with their phones.' : 'You drive with the keyboard.';
  const show = () => {
    $('title').hidden = next !== $('title'); $('pick').hidden = next !== $('pick');
    for (const m of [$('title'), $('pick')]) m.classList.remove('leave', 'enter');
    void next.offsetWidth; next.classList.add('enter'); shown = next;
    if (picking) document.querySelector('.city:not(:disabled)')?.focus({ preventScroll: true });
  };
  if (!shown || shown === next || reduce) return show();
  shown.classList.add('leave'); setTimeout(show, 200);
}
addEventListener('hashchange', render); render();
// back from a city page via the browser: the page may come back from memory, faded out; bring it back
addEventListener('pageshow', e => { if (e.persisted) { document.body.classList.remove('going'); $('cities').classList.remove('choosing'); document.querySelectorAll('.chosen').forEach(c => c.classList.remove('chosen')) } });
$('crew').onclick = () => { location.hash = 'crew' };
$('solo').onclick = () => { location.hash = 'solo' };
$('back').onclick = () => { location.hash = '' };
// choosing a city: the card lifts, the rest fall back, the page fades to paper, and the city page opens on that paper
let going = false;
$('cities').onclick = e => {
  const b = e.target.closest('.city'); if (!b || b.disabled || going) return;
  const href = b.dataset.href + '?play=' + location.hash.slice(1);
  if (reduce) { location.href = href; return }
  going = true; b.classList.add('chosen'); $('cities').classList.add('choosing');
  setTimeout(() => document.body.classList.add('going'), 160);
  setTimeout(() => { location.href = href; going = false }, 540);
};
})();
</script>
</body></html>
