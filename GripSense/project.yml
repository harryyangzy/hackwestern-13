name: GripSense
options:
  bundleIdPrefix: com.harryyangzy.hw13
  deploymentTarget:
    iOS: "17.0"
targets:
  GripSense:
    type: application
    platform: iOS
    sources: [GripSense]
    settings:
      base:
        DEVELOPMENT_TEAM: 494Y7P7F4M
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.harryyangzy.hw13.gripsense
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: GripSense
        INFOPLIST_KEY_NSMotionUsageDescription: "Reads motion sensors to measure how vibration is damped by your grip."
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
